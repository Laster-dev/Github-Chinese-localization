name: 自动构建并发布 Release

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: automatic-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-release:
    name: 构建 Android APK 并发布
    runs-on: ubuntu-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: 设置 Gradle
        uses: gradle/gradle-build-action@v3
        with:
          gradle-version: "9.3.1"

      - name: 准备临时 Release 签名证书
        shell: bash
        run: |
          set -euo pipefail
          keytool -genkeypair \
            -v \
            -keystore "$RUNNER_TEMP/release-keystore.jks" \
            -storetype JKS \
            -storepass github-actions \
            -keypass github-actions \
            -alias upload \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=GitHub Actions, OU=Build, O=Github-Chinese-localization, C=CN"
          echo "KEYSTORE_PATH=$RUNNER_TEMP/release-keystore.jks" >> "$GITHUB_ENV"
          echo "STORE_PASSWORD=github-actions" >> "$GITHUB_ENV"
          echo "KEY_PASSWORD=github-actions" >> "$GITHUB_ENV"

      - name: 运行单元测试
        run: gradle :app:testDebugUnitTest --no-daemon --stacktrace

      - name: 构建 Release APK
        run: gradle :app:assembleRelease --no-daemon --stacktrace

      - name: 生成日期标识并准备 APK
        id: package
        shell: bash
        run: |
          set -euo pipefail
          release_tag="release-$(date -u +'%Y%m%d-%H%M%S')"
          apk_name="github-chinese-localization-${release_tag}.apk"
          cp app/build/outputs/apk/release/app-release.apk "$apk_name"
          echo "release_tag=$release_tag" >> "$GITHUB_OUTPUT"
          echo "apk_name=$apk_name" >> "$GITHUB_OUTPUT"

      - name: 发布到 GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.package.outputs.release_tag }}" \
            "${{ steps.package.outputs.apk_name }}" \
            --repo "${{ github.repository }}" \
            --target "${{ github.sha }}" \
            --title "${{ steps.package.outputs.release_tag }}" \
            --generate-notes
